<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>FixConnect — چت</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; background: #f4f6f8; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a73e8; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header button.back { background: none; border: none; color: #fff; font-size: 20px; }
  header .title { font-weight: 700; font-size: 15px; }

  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
  .msg.mine { align-self: flex-start; background: #1a73e8; color: #fff; border-bottom-left-radius: 4px; }
  .msg.theirs { align-self: flex-end; background: #fff; color: #222; border-bottom-right-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .msg-time { font-size: 10px; opacity: 0.6; margin-top: 4px; }

  .input-row { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #eee; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  #msg-input { flex: 1; padding: 11px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; font-family: inherit; }
  #send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #1a73e8; color: #fff; font-size: 16px; }

  .empty { text-align: center; color: #999; margin-top: 30px; font-size: 13px; }
  #loading-screen { position: fixed; inset: 0; background: #f4f6f8; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; z-index: 999; }
</style>
</head>
<body>

<div id="loading-screen">در حال بارگذاری...</div>

<header>
  <button class="back" onclick="history.back()">›</button>
  <div class="title" id="chat-title">چت</div>
</header>

<div id="messages"></div>

<div class="input-row">
  <input id="msg-input" placeholder="پیامت رو بنویس..." />
  <button id="send-btn">➤</button>
</div>

<script type="module">
  import { supabase } from "../shared/supabase-client.js";
  import { getCurrentProfile } from "../shared/auth.js";
  import { esc } from "../shared/utils.js";

  const profile = await getCurrentProfile();
  if (!profile || !["customer", "professional"].includes(profile.role)) {
    window.location.href = "/fixconnect/index.html";
    throw new Error("not authorized");
  }

  const params = new URLSearchParams(location.search);
  const requestId = params.get("request");
  if (!requestId) {
    document.body.innerHTML = `<div class="empty">درخواست نامعتبر</div>`;
    throw new Error("missing request id");
  }

  const { data: conversation, error: convError } = await supabase
    .from("conversations")
    .select("id, service_requests ( devices ( name ) ), professional:professional_id ( professional_profiles ( business_name ) )")
    .eq("request_id", requestId)
    .eq("customer_id", profile.id)
    .single();

  document.getElementById("loading-screen").style.display = "none";

  if (convError || !conversation) {
    document.body.innerHTML = `<div class="empty">مکالمه‌ای پیدا نشد — هنوز متخصصی درخواست شما رو نپذیرفته</div>`;
    throw new Error("no conversation");
  }

  // FIX (XSS): business_name / device name are set via textContent
  // below, not innerHTML, so no escaping needed for the title.
  document.getElementById("chat-title").textContent =
    `${conversation.professional?.professional_profiles?.[0]?.business_name || "متخصص"} — ${conversation.service_requests?.devices?.name || ""}`;

  const messagesEl = document.getElementById("messages");

  async function loadMessages() {
    const { data: messages } = await supabase
      .from("messages")
      .select("id, sender_id, content, created_at")
      .eq("conversation_id", conversation.id)
      .order("created_at", { ascending: true });

    messagesEl.innerHTML = "";
    if (!messages || messages.length === 0) {
      messagesEl.innerHTML = `<div class="empty">هنوز پیامی نیست، شروع کن!</div>`;
      return;
    }

    messages.forEach((m) => {
      const div = document.createElement("div");
      div.className = "msg " + (m.sender_id === profile.id ? "mine" : "theirs");
      // FIX (XSS): message content is now escaped before insertion.
      // Previously this was raw ${m.content} — any user could send a
      // <script>/<img onerror> chat message that would execute in the
      // other side's browser (stored XSS).
      div.innerHTML = `${esc(m.content)}<div class="msg-time">${new Date(m.created_at).toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" })}</div>`;
      messagesEl.appendChild(div);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;

    await supabase
      .from("messages")
      .update({ read_at: new Date().toISOString() })
      .eq("conversation_id", conversation.id)
      .neq("sender_id", profile.id)
      .is("read_at", null);
  }

  await loadMessages();

  supabase
    .channel(`conversation-${conversation.id}`)
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: `conversation_id=eq.${conversation.id}` },
      () => loadMessages()
    )
    .subscribe();

  async function sendMessage() {
    const input = document.getElementById("msg-input");
    const content = input.value.trim();
    if (!content) return;
    input.value = "";

    await supabase.from("messages").insert({
      conversation_id: conversation.id,
      sender_id: profile.id,
      content,
    });

    const { data: conv } = await supabase
      .from("conversations")
      .select("professional_id")
      .eq("id", conversation.id)
      .single();

    if (conv) {
      await supabase.from("notifications").insert({
        user_id: conv.professional_id,
        title: "پیام جدید",
        body: content.slice(0, 50),
        type: "new_message",
        related_request_id: requestId,
      });
    }
  }

  document.getElementById("send-btn").addEventListener("click", sendMessage);
  document.getElementById("msg-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
